<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9f0">
    <meta name="description" content="메뉴 후보를 넣고 룰렛을 돌려 오늘의 메뉴를 골라 보세요.">
    <title>오늘 뭐 먹지? - 메뉴 룰렛</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="food-backdrop" aria-hidden="true">
      <span class="food-food food-noodles">🍜</span>
      <span class="food-food food-sushi">🍣</span>
      <span class="food-food food-pizza">🍕</span>
      <span class="food-food food-dumpling">🥟</span>
      <span class="food-food food-rice">🍙</span>
      <span class="food-food food-burger">🍔</span>
      <span class="food-food food-curry">🍛</span>
      <span class="food-food food-salad">🥗</span>
      <span class="food-food food-sparkle">✦</span>
      <span class="food-food food-heart">♡</span>
    </div>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="오늘 뭐 먹지? 홈">
          <span class="brand-mark" aria-hidden="true">밥</span>
          <span>오늘 뭐 먹지?</span>
        </a>
        <span class="header-note"><span class="status-dot" aria-hidden="true"></span> 메뉴 고민 해결 중</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">TODAY'S MENU PICK</p>
          <h1 id="page-title">오늘의 음식은<span>?</span></h1>
          <p class="intro-copy">먹고 싶은 메뉴를 모아 룰렛을 돌려보세요.<br class="desktop-break">오늘의 한 끼를 골라드릴게요!</p>
        </section>

        <div class="app-layout">
          <section class="wheel-card" aria-labelledby="roulette-heading">
            <div class="section-heading">
              <div>
                <p class="eyebrow">LET'S PICK</p>
                <h2 id="roulette-heading">오늘의 메뉴 룰렛</h2>
              </div>
              <span class="sparkle" aria-hidden="true">✳</span>
            </div>

            <div class="wheel-area">
              <span class="wheel-pointer" aria-hidden="true"></span>
              <div class="wheel-frame">
                <svg id="roulette-wheel" class="roulette-wheel" viewBox="0 0 400 400" role="img" aria-label="메뉴 후보가 표시된 룰렛"></svg>
                <div class="wheel-center" aria-hidden="true"><span>GO!</span></div>
              </div>
            </div>

            <p id="spin-hint" class="spin-hint">메뉴를 2개 이상 담으면 시작할 수 있어요.</p>
            <button id="spin-button" class="spin-button" type="button" disabled>
              <span aria-hidden="true">↻</span> 룰렛 돌리기
            </button>
            <p id="result" class="result" role="status" aria-live="polite"></p>
          </section>

          <section class="menu-card" aria-labelledby="menu-heading">
            <div class="section-heading menu-section-heading">
              <div>
                <p class="eyebrow">YOUR OPTIONS</p>
                <h2 id="menu-heading">메뉴 후보</h2>
              </div>
              <span id="menu-count" class="menu-count">0개</span>
            </div>

            <form id="menu-form" class="menu-form">
              <label class="visually-hidden" for="menu-input">추가할 메뉴 이름</label>
              <input id="menu-input" name="menu" type="text" maxlength="40" placeholder="예: 김치찌개" autocomplete="off">
              <button type="submit" class="add-button"><span aria-hidden="true">＋</span> 추가</button>
            </form>
            <button id="random-menu-button" class="random-menu-button" type="button">
              <span aria-hidden="true">✦</span> 전체 메뉴를 랜덤으로
            </button>
            <div class="group-recommendation">
              <label for="party-size">함께 먹는 인원</label>
              <div class="recommendation-controls">
                <select id="party-size" name="party-size">
                  <option value="2">2명</option>
                  <option value="3">3명</option>
                  <option value="4">4명</option>
                  <option value="5">5명</option>
                  <option value="6">6명</option>
                  <option value="7">7명</option>
                  <option value="8">8명</option>
                  <option value="9">9명</option>
                  <option value="10">10명</option>
                </select>
                <button id="recommend-button" class="recommend-button" type="button">
                  <span aria-hidden="true">♡</span> 같이 먹기 추천
                </button>
              </div>
            </div>
            <p id="message" class="message" role="status" aria-live="polite"></p>

            <ul id="menu-list" class="menu-list" aria-label="룰렛에 들어갈 메뉴 목록"></ul>
            <div id="empty-state" class="empty-state" hidden>
              <span aria-hidden="true">🍽️</span>
              <p>아직 메뉴가 없어요.<br>먹고 싶은 메뉴를 추가해 보세요!</p>
            </div>

            <div class="list-footer">
              <span class="save-note"><span aria-hidden="true">♡</span> 영양정보는 1인분 기준 대략치예요</span>
              <button id="clear-button" class="clear-button" type="button">전체 비우기</button>
            </div>
          </section>
        </div>
      </main>

      <footer class="site-footer">상경학부 202602204 이서연</footer>
    </div>
  </body>
</html>
